services:
  web:
    image: ghcr.io/tranfu-labs/agent-kernel-app:latest
    environment:
      NODE_ENV: production
      COPILOTKIT_TELEMETRY_DISABLED: 1
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: file:../data/agent-kernel-prod.db
      CLOUDAIKEY_API_KEY: ${CLOUDAIKEY_API_KEY:-}
      CLOUDAIKEY_BASE_URL: ${CLOUDAIKEY_BASE_URL:-https://api.cloudaikey.com/v1}
      IMAGE_MINIMAX_BASE_URL: ${IMAGE_MINIMAX_BASE_URL:-https://api.minimaxi.com}
      IMAGE_GROK_API_KEY: ${IMAGE_GROK_API_KEY:-}
      IMAGE_GROK_BASE_URL: ${IMAGE_GROK_BASE_URL:-}
    expose:
      - "3000"
    volumes:
      - agentkernel-web-data:/app/apps/web/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  agentkernel-web-data:
    name: agent-kernel-web-data
